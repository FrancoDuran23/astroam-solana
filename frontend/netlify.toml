# Netlify: set the site base directory to `frontend`, or run from this folder.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback. /api is not served by Netlify; the browser calls VITE_API_BASE_URL.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
