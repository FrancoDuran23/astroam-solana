[package]
name = "astroam-escrow"
version = "0.1.0"
edition = "2021"
publish = false
description = "Prepaid USDC escrow for AstroAm on Solana. Meter-signed close, checkpoint, and a timeout that pays the attested amount."

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []

[dependencies]
solana-program = "=1.18.26"
spl-token = { version = "=4.0.0", features = ["no-entrypoint"] }

[dev-dependencies]
solana-program-test = "=1.18.26"
solana-sdk = "=1.18.26"
serde_json = "1"
tokio = { version = "=1.40.0", features = ["macros", "rt-multi-thread"] }
